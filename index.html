<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>双视角深度重建 · 会议室</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f14;
        --panel: rgba(12, 18, 28, 0.82);
        --text: #e8eef7;
        --muted: #9aabbf;
        --accent: #3dd6c6;
        --line: rgba(255, 255, 255, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(1200px 800px at 20% 0%, #152033 0%, var(--bg) 55%);
        color: var(--text);
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .hud {
        position: absolute;
        left: 20px;
        top: 18px;
        z-index: 2;
        pointer-events: none;
        max-width: min(420px, calc(100vw - 40px));
      }

      .hud h1 {
        margin: 0 0 6px;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: 0.02em;
      }

      .hud p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .status {
        position: absolute;
        left: 20px;
        bottom: 18px;
        z-index: 2;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        backdrop-filter: blur(10px);
        font-size: 12px;
        color: var(--muted);
      }

      .status strong {
        color: var(--accent);
        font-weight: 600;
      }

      .hint {
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="hud">
        <h1>双视角 Depth Anything V2 重建</h1>
        <p>两台固定摄像头对拍会议室；深度图反投影为彩色网格，可在场景中自由浏览与融合对齐。</p>
      </div>
      <div class="status" id="status">正在加载资源…</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
